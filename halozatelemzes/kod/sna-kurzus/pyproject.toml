[project]
name = "sna-kurzus"
version = "0.1.0"
description = "Hálózatelemzés – a kurzus futó projektje"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "rdata>=1.1.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "pytest>=9.2.0",
]

# A sna_utils mappát „szerkeszthető” csomagként telepítjük, így bármelyik
# almappából (leckek/, tests/) importálható, és minden módosítás azonnal él.
[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sna_utils"
module-root = ""
